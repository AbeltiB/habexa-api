services:
  - type: web
    name: habexa-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: AFROSMS_API_KEY
        sync: false
      - key: AFROSMS_SENDER_ID
        value: HABEXA
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@habexa.com
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: habexa-media
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@habexa.com
      - key: API_URL
        value: https://api.habexa.com
      - key: WEB_URL
        value: https://habexa.com
